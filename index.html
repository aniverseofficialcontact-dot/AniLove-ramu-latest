<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Remix AniLove - Anime Tracker & Discovery</title>
    <meta name="description" content="Premium anime discovery, airing schedule, library tracking, watch progress, and streaming companion powered by AniList and custom player integrations." />
    
    <!-- PWA & Android Meta Tags -->
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AniLove" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-512.svg" />

    <meta property="og:title" content="AniLove - Anime Tracker, Streaming & Edits" />
    <meta property="og:description" content="Discover trending anime, stream episodes, and watch HD anime edits on AniLove. Your ultimate anime companion." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-banner.jpg" />
    <meta property="og:image:secure_url" content="/og-banner.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AniLove - Anime Tracker, Streaming & Edits" />
    <meta name="twitter:description" content="Discover trending anime, stream episodes, and watch HD anime edits on AniLove." />
    <meta name="twitter:image" content="/og-banner.jpg" />
  </head>
  <body class="bg-slate-950 text-slate-100 select-none overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration notice:', err);
          });
        });
      }
    </script>
  </body>
</html>
